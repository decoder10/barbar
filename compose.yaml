services:
  mongodb:
    # 8.2 carries the fix for SERVER-121912; MongoDB 8.0 refuses to start on Linux kernels 6.19+,
    # which is what recent Docker Desktop VMs ship.
    image: mongo:8.2
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - barbar-mongodb:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { if (!rs.status().ok) quit(1); } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}); quit(1); } if (!db.hello().isWritablePrimary) quit(1);"
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  barbar-mongodb:
