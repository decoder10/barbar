[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Owner photo uploads are optimised with sharp, a native module: ship it unbundled together with its
# Linux binaries, which sharp loads by platform name.
[functions."barbar-photos"]
  external_node_modules = ["sharp"]
  included_files = ["node_modules/@img/sharp-linux-x64/**", "node_modules/@img/sharp-libvips-linux-x64/**"]

# `/menu` is rendered by `netlify/functions/barbar-menu-page.ts` (prices in the HTML); the built
# `guest-menu.html` stays its template and fallback. Never name it `menu.html`: a static page at a
# function's path makes Netlify answer 500 before the function runs.
# Its renderer is pre-built by `npm run build` (scripts/build-menu-renderer.mjs) and loaded at request
# time, so a renderer failure falls back to `guest-menu.html` instead of failing the function.
[functions."barbar-menu-page"]
  included_files = ["netlify/generated/guest-menu-renderer.mjs"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
  for = "/barbar/photos/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/barbar-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
